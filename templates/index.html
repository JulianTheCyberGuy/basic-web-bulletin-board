<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Basic Bulletin Board</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 800px;
      margin: 40px auto;
      background: white;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    h1 {
      margin-top: 0;
    }

    form {
      border: 1px solid #ddd;
      padding: 16px;
      border-radius: 6px;
      margin-bottom: 24px;
      background: #fafafa;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 6px;
      border: 1px solid #bbb;
      font-size: 14px;
      box-sizing: border-box;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    button {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 6px;
      border: none;
      background-color: #2c7be5;
      color: white;
      cursor: pointer;
    }

    .post {
      position: relative;
      border: 1px solid #e2e2e2;
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 16px;
      background: #ffffff;
    }

    .timestamp {
      position: absolute;
      top: 12px;
      right: 16px;
      font-size: 12px;
      color: #666;
    }

    .author {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .post-body {
      white-space: pre-wrap;
    }

    .error {
      color: red;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Basic Bulletin Board</h1>

    <form id="postForm">
      <label for="email">Author Email</label>
      <input id="email" type="email" placeholder="name@example.com" required />

      <label for="body">Post</label>
      <textarea id="body" placeholder="Write your post..." required></textarea>

      <button type="submit">Submit Post</button>
      <div id="formError" class="error"></div>
    </form>

    <div id="posts"></div>
  </div>

  <script src="/static/main.js"></script>

</body>
</html>
